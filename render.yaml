# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: election-night-desk
    runtime: node
    plan: starter            # stays awake; "free" sleeps after 15 min idle
    region: virginia
    buildCommand: "true"     # no dependencies to install
    startCommand: node server.js
    healthCheckPath: /healthz
    # Keeps market trend history and the race-call log across restarts and deploys (lib/persist.js).
    disk:
      name: dashboard-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: STATE_DIR
        value: /var/data
      - key: DASHBOARD_PASSWORD
        sync: false          # you'll be prompted for it on first deploy
